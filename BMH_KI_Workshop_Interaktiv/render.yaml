services:
  - type: web
    name: bmh-ki-workshop
    runtime: python
    plan: free
    rootDir: BMH_KI_Workshop_Interaktiv
    buildCommand: echo "Keine Zusatzpakete notwendig"
    startCommand: python ki_workshop.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PUBLIC_URL
        value: https://bmh-ki-workshop.onrender.com
      - key: ADMIN_KEY
        generateValue: true
